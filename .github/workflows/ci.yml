name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      # The mypy hook in .pre-commit-config.yaml runs as `language: system` — it needs
      # the project's actual dependencies (Django, DRF, django-stubs) on the path to
      # type-check meaningfully, so they have to be installed before pre-commit runs,
      # not left to pre-commit's own isolated per-hook environments.
      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vaultis
          POSTGRES_USER: vaultis
          POSTGRES_PASSWORD: vaultis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: github-actions-ci-key-not-used-anywhere-real
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://vaultis:vaultis@localhost:5432/vaultis
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: pytest
